<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Denkzirkus</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg: #12171E; --card: #1B222C; --line: #2A3441; --txt: #E8EDF2; --muted: #93A0AF;
  --acc: #3FB6A8; --good: #4CC38A; --bad: #E5674F; --warn: #E0A93B; --fun: #F08A5D;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 8px) 14px calc(var(--sab) + 28px); }
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
#back { background: none; border: 0; color: var(--txt); font-size: 30px; line-height: 1; padding: 0 12px 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .good { color: var(--good); } .bad { color: var(--bad); }
.big { font-size: 28px; font-weight: 700; } .center { text-align: center; }
button, .chip { font: inherit; color: var(--txt); background: #26303D; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
button.primary { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 700; }
button.block { display: block; width: 100%; margin-top: 8px; }
button.ghost { background: none; } button:disabled { opacity: .4; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip.on { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; } .row > .grow { flex: 1; min-width: 0; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.games button { text-align: left; padding: 12px; }
.games .ic { font-size: 30px; line-height: 1.1; display: block; } .games .lv { display: block; font-size: 12px; color: var(--muted); }
input[type=text] { font: inherit; color: var(--txt); background: #0E1319; border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
label.f { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
ul { margin: 6px 0; padding-left: 20px; } li { margin: 5px 0; }

#play { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--sat) + 6px) 14px calc(var(--sab) + 14px); touch-action: manipulation; }
#play[hidden], #modal[hidden] { display: none; }
#p-top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
#p-close { background: none; border: 0; font-size: 28px; padding: 0 10px 4px 0; }
#p-title { flex: 1; font-weight: 700; font-size: 18px; } #p-lvl { font-size: 13px; color: var(--muted); }
#p-body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow-y: auto; }
.emo { font-size: 56px; line-height: 1.1; text-align: center; }
.prog { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.q { font-size: 19px; text-align: center; margin: 6px 0; } .q b { color: var(--fun); }
.seq { font-size: 30px; font-weight: 700; text-align: center; letter-spacing: .02em; font-variant-numeric: tabular-nums; margin: 10px 0; line-height: 1.4; }
.seq em { font-style: normal; color: var(--fun); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.opts.three { grid-template-columns: 1fr 1fr 1fr; }
.opts button { padding: 14px 6px; font-size: 19px; min-height: 58px; }
button.ok { background: #1E3B2E; border-color: var(--good); } button.err { background: #4A2622; border-color: var(--bad); }
.why { background: #0E1319; border-radius: 10px; padding: 8px 10px; margin-top: 12px; font-size: 15px; text-align: center; }
.mx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 300px; margin: 8px auto; }
.mx div { aspect-ratio: 1; background: #0E1319; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: 1px; }
.mx div.miss { border: 2px dashed var(--fun); color: var(--fun); font-size: 30px; }
.fig { font-size: 22px; letter-spacing: 1px; }
.clues { margin: 4px 0 10px; padding-left: 22px; } .clues li { margin: 5px 0; } .clues li.viol { color: var(--bad); }
.slots { display: grid; gap: 6px; margin: 8px 0; }
.slots button { padding: 4px 0; min-height: 64px; font-size: 30px; } .slots button small { display: block; font-size: 11px; color: var(--muted); }
.pal { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 8px; }
.pal button { font-size: 28px; padding: 6px 12px; min-width: 52px; } .pal button.sel { border-color: var(--acc); background: #1E3B38; } .pal button.used { opacity: .3; }
.hist { margin: 6px 0; max-height: 40vh; overflow-y: auto; } .hist div { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 24px; }
.hist div span { font-size: 14px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.sd { display: grid; gap: 3px; max-width: 340px; margin: 8px auto; }
.sd button { padding: 0; aspect-ratio: 1; font-size: 22px; font-weight: 400; border-radius: 6px; min-width: 0; }
.sd button.giv { font-weight: 800; background: #0E1319; } .sd button.sel { border-color: var(--acc); background: #1E3B38; }
.sd button.br { margin-right: 5px; } .sd button.bb { margin-bottom: 5px; }
.stm { background: #0E1319; border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 17px; line-height: 1.6; }
.sol { background: #0E1319; border-radius: 10px; padding: 8px 10px; margin-top: 10px; font-size: 15px; text-align: center; line-height: 1.7; }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal > div { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(var(--sab) + 16px); }
#modal h3 { margin: 0 0 6px; }
.btns { display: flex; gap: 8px; margin-top: 12px; } .btns button { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="Zurück">‹</button><h1 id="title">Denkzirkus</h1></header>
  <main id="view"></main>
</div>
<div id="play" hidden>
  <div id="p-top"><button id="p-close" aria-label="Schließen">‹</button><span id="p-title"></span><span id="p-lvl"></span></div>
  <div id="p-body"></div>
</div>
<div id="modal" hidden><div id="modal-in"></div></div>

<script>
'use strict';
// =====================================================================
// Denkzirkus: Logik-Training fuer Kinder und Erwachsene. Sieben Arten von
// Raetseln, alle vom Handy erzeugt und vor dem Stellen nachgerechnet, damit
// jedes genau eine Loesung hat. Spieler, Altersgruppen und Stufen wie im
// Merkzirkus. Details in README.md.
// Aufbau: Daten -> Raetsel-Erzeuger (rein) -> Bausteine -> Spiele
//         -> Ansichten -> Selbsttest (dzTests, ?debug=1).
// =====================================================================
const $ = id => document.getElementById(id);
const K = { db: 'denkzirkus.data.v1' };
let saveOk = true;
function load(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
const db = Object.assign({ schema: 1, profiles: [], cur: null }, load(K.db, {}));
function save() { try { localStorage.setItem(K.db, JSON.stringify(db)); } catch (e) { saveOk = false; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
const AGES = { k1: { name: 'Kind 6–9', start: 1 }, k2: { name: 'Kind 10–13', start: 2 }, e: { name: 'Ab 14 und Erwachsene', start: 4 } };
function prof() { return db.profiles.find(p => p.id === db.cur) || null; }
function lvl(p, g) { return p.levels[g] || AGES[p.age].start; }
function isKid(p) { return p.age !== 'e'; }
function levelStep(l, ok) { return clamp(l + (ok ? 1 : -1), 1, 10); }
function shuffle(a, rnd) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)), t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function sample(a, n, rnd) { return shuffle(a, rnd).slice(0, n); }
function range(n) { const a = []; for (let i = 0; i < n; i++) a.push(i); return a; }

// ================================================================ Raetsel-Erzeuger (rein)
// ---- 1. Zahlenreihen: {terms, answer, opts, rule}
function makeReihe(l, rnd) {
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const gen = (n, f) => { const a = []; for (let i = 0; i < n; i++) a.push(f(i, a)); return a; };
  let t, rule;
  if (l <= 2) { const k = l === 1 ? ri(1, 5) : ri(2, 10), s = ri(1, l === 1 ? 10 : 30); t = gen(6, i => s + k * i); rule = 'immer +' + k; }
  else if (l === 3) { const k = ri(2, 9), s = ri(60, 99); t = gen(6, i => s - k * i); rule = 'immer −' + k; }
  else if (l === 4) { const k = ri(2, 3), s = ri(1, 4); t = gen(6, i => s * Math.pow(k, i)); rule = 'immer ×' + k; }
  else if (l === 5) { const a = ri(1, 5), b = ri(6, 10), s = ri(1, 20); t = gen(6, (i, x) => i ? x[i - 1] + (i % 2 ? a : b) : s); rule = 'abwechselnd +' + a + ' und +' + b; }
  else if (l === 6) { const s = ri(1, 10), d = ri(1, 3); t = gen(6, (i, x) => i ? x[i - 1] + d + i - 1 : s); rule = 'der Abstand wächst jedes Mal um 1 (+' + d + ', +' + (d + 1) + ', +' + (d + 2) + ' …)'; }
  else if (l === 7) {
    if (rnd() < 0.5) { const a = ri(1, 5), b = ri(1, 5); t = gen(6, (i, x) => i === 0 ? a : i === 1 ? b : x[i - 1] + x[i - 2]); rule = 'jede Zahl ist die Summe der beiden davor'; }
    else { const s = ri(1, 4); t = gen(6, i => (s + i) * (s + i)); rule = 'Quadratzahlen (' + s + '·' + s + ', ' + (s + 1) + '·' + (s + 1) + ' …)'; }
  }
  else if (l === 8) { const c = ri(1, 2), s = ri(3, 6); t = gen(6, (i, x) => i ? (i % 2 ? x[i - 1] * 2 : x[i - 1] - c) : s); rule = 'abwechselnd ×2 und −' + c; }
  else if (l === 9) { const s1 = ri(1, 9), k1 = ri(2, 5), s2 = ri(20, 40), k2 = ri(2, 6); t = gen(7, i => i % 2 === 0 ? s1 + k1 * (i / 2) : s2 - k2 * ((i - 1) / 2)); rule = 'zwei Reihen im Wechsel: eine immer +' + k1 + ', die andere immer −' + k2; }
  else { const k = ri(2, 3), c = ri(1, 4), s = ri(1, 3); t = gen(6, (i, x) => i ? x[i - 1] * k + c : s); rule = 'immer ×' + k + ' und dann +' + c; }
  const answer = t[t.length - 1], set = [answer]; let guard = 0;
  while (set.length < 4 && guard++ < 200) { const d = ri(1, answer > 60 ? 12 : 5) * (rnd() < 0.5 ? -1 : 1), c = answer + d; if (set.indexOf(c) < 0) set.push(c); }
  return { terms: t.slice(0, -1), answer, opts: shuffle(set, rnd), rule };
}
// ---- 2. Muster (3x3): jede Zelle {s: Form, c: Farbe, n: Anzahl}. modes je Eigenschaft:
// 'const' ueberall gleich, 'row' je Zeile gleich, 'col' je Spalte gleich, 'latin' jede Zeile und Spalte alle drei.
const MUSTER_MODES = [null, ['col', 'const', 'const'], ['latin', 'const', 'const'], ['latin', 'row', 'const'], ['latin', 'col', 'const'], ['latin', 'latin', 'const'],
  ['latin', 'latin', 'const'], ['latin', 'row', 'col'], ['latin', 'latin', 'col'], ['latin', 'latin', 'latin'], ['latin', 'latin', 'latin']];
function makeMuster(l, rnd) {
  const modes = MUSTER_MODES[l], keys = ['s', 'c', 'n'], fns = modes.map((m, i) => {
    const perm = shuffle([0, 1, 2], rnd), a = 1 + (l >= 6 ? Math.floor(rnd() * 2) : 0), b = Math.floor(rnd() * 3);
    return m === 'const' ? () => perm[0] : m === 'row' ? r => perm[r] : m === 'col' ? (r, c) => perm[c] : (r, c) => perm[(r * a + c + b) % 3];
  });
  const cells = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const o = {}; keys.forEach((k, i) => { o[k] = fns[i](r, c); }); cells.push(o); }
  const miss = l >= 6 ? Math.floor(rnd() * 9) : 8, right = cells[miss], same = (x, y) => x.s === y.s && x.c === y.c && x.n === y.n;
  const opts = [right], want = l >= 5 ? 6 : 4; let guard = 0;
  while (opts.length < want && guard++ < 300) {
    const o = { s: right.s, c: right.c, n: right.n }, k = keys[Math.floor(rnd() * 3)]; o[k] = (o[k] + 1 + Math.floor(rnd() * 2)) % 3;
    if (rnd() < 0.3) { const k2 = keys[Math.floor(rnd() * 3)]; o[k2] = (o[k2] + 1) % 3; }
    if (!opts.some(x => same(x, o))) opts.push(o);
  }
  return { cells, miss, modes, opts: shuffle(opts, rnd), right };
}
// Passt die Zelle x an die Stelle miss? (fuer den Selbsttest: genau eine Auswahl darf passen)
function musterFits(M, x) {
  const r0 = Math.floor(M.miss / 3), c0 = M.miss % 3, at = (r, c) => r === r0 && c === c0 ? x : M.cells[r * 3 + c];
  return ['s', 'c', 'n'].every((k, i) => {
    const m = M.modes[i], row = [0, 1, 2].map(c => at(r0, c)[k]), col = [0, 1, 2].map(r => at(r, c0)[k]), other = (r0 + 1) % 3;
    if (m === 'const') return x[k] === at(other, c0)[k];
    if (m === 'row') return row[0] === row[1] && row[1] === row[2];
    if (m === 'col') return col[0] === col[1] && col[1] === col[2];
    return new Set(row).size === 3 && new Set(col).size === 3;
  });
}
// ---- 3. Platz-Raetsel: n Tiere in einer Reihe, Hinweise mit genau einer Loesung.
const TIERE = [['🐶', 'Der Hund', 'dem Hund'], ['🐱', 'Die Katze', 'der Katze'], ['🐭', 'Die Maus', 'der Maus'], ['🐸', 'Der Frosch', 'dem Frosch'],
  ['🦊', 'Der Fuchs', 'dem Fuchs'], ['🐻', 'Der Bär', 'dem Bären'], ['🐰', 'Der Hase', 'dem Hasen'], ['🦉', 'Die Eule', 'der Eule']];
const PLATZ_N = [0, 3, 3, 4, 4, 4, 5, 5, 5, 6, 6];
function platzTypes(l) { return ['pos', 'ld'].concat(l >= 3 ? ['neben', 'links'] : [], l >= 5 ? ['nichtpos', 'nichtneben'] : [], l >= 7 ? ['zwischen'] : []); }
function platzMaxPos(l) { return l >= 8 ? 0 : l >= 5 ? 1 : 9; }
function clueOk(c, p) {
  const pos = x => p.indexOf(x), d = Math.abs(pos(c.a) - pos(c.b));
  if (c.t === 'pos') return pos(c.a) === c.k; if (c.t === 'nichtpos') return pos(c.a) !== c.k;
  if (c.t === 'ld') return pos(c.a) + 1 === pos(c.b); if (c.t === 'links') return pos(c.a) < pos(c.b);
  if (c.t === 'neben') return d === 1; if (c.t === 'nichtneben') return d !== 1;
  const x = pos(c.a), y = pos(c.b), z = pos(c.c); return (y < x && x < z) || (z < x && x < y);
}
function perms(n) { const out = [], go = (cur, rest) => { if (!rest.length) { out.push(cur); return; } rest.forEach((x, i) => go(cur.concat([x]), rest.slice(0, i).concat(rest.slice(i + 1)))); }; go([], range(n)); return out; }
function solutions(n, clues) { return perms(n).filter(p => clues.every(c => clueOk(c, p))); }
function makePlatz(l, rnd) {
  const n = PLATZ_N[l], types = platzTypes(l), all = perms(n), animals = sample(TIERE, n, rnd);
  for (let attempt = 0; attempt < 60; attempt++) {
    const sol = shuffle(range(n), rnd), pos = x => sol.indexOf(x); let cand = [];
    for (let a = 0; a < n; a++) {
      cand.push({ t: 'pos', a, k: pos(a) }); for (let k = 0; k < n; k++) if (k !== pos(a)) cand.push({ t: 'nichtpos', a, k });
      for (let b = 0; b < n; b++) { if (a === b) continue; const d = Math.abs(pos(a) - pos(b));
        if (pos(a) + 1 === pos(b)) cand.push({ t: 'ld', a, b }); if (pos(a) < pos(b)) cand.push({ t: 'links', a, b });
        if (a < b) cand.push({ t: d === 1 ? 'neben' : 'nichtneben', a, b });
        for (let c = b + 1; c < n; c++) { if (c === a) continue; const x = pos(a), y = pos(b), z = pos(c); if ((y < x && x < z) || (z < x && x < y)) cand.push({ t: 'zwischen', a, b, c }); } }
    }
    cand = shuffle(cand.filter(c => types.indexOf(c.t) >= 0), rnd); let nPos = 0; const maxPos = platzMaxPos(l);
    cand = cand.filter(c => c.t !== 'pos' || nPos++ < maxPos);
    let alive = all, chosen = [];
    for (const c of cand) { const next = alive.filter(p => clueOk(c, p)); if (next.length < alive.length) { chosen.push(c); alive = next; } if (alive.length === 1) break; }
    if (alive.length !== 1) continue;
    for (let i = chosen.length - 1; i >= 0; i--) { const rest = chosen.slice(0, i).concat(chosen.slice(i + 1)); if (solutions(n, rest).length === 1) chosen = rest; }
    return { n, animals, sol, clues: chosen };
  }
  const sol = range(n); return { n, animals, sol, clues: sol.map(a => ({ t: 'pos', a, k: a })) };      // Notausgang, praktisch nie erreicht
}
function clueText(c, an, n) {
  const N = x => an[x][1], D = x => an[x][2], P = k => k === 0 ? 'ganz links' : k === n - 1 ? 'ganz rechts' : 'auf Platz ' + (k + 1);
  return c.t === 'pos' ? N(c.a) + ' steht ' + P(c.k) + '.' : c.t === 'nichtpos' ? N(c.a) + ' steht nicht ' + P(c.k) + '.'
    : c.t === 'ld' ? N(c.a) + ' steht direkt links von ' + D(c.b) + '.' : c.t === 'links' ? N(c.a) + ' steht irgendwo links von ' + D(c.b) + '.'
    : c.t === 'neben' ? N(c.a) + ' steht direkt neben ' + D(c.b) + '.' : c.t === 'nichtneben' ? N(c.a) + ' steht nicht neben ' + D(c.b) + '.'
    : N(c.a) + ' steht irgendwo zwischen ' + D(c.b) + ' und ' + D(c.c) + '.';
}
// ---- 4. Vergleichen: Kette von Vergleichen, daraus eine Frage.
const KINDER = ['Mia', 'Ben', 'Lea', 'Tom', 'Ida', 'Max', 'Pia', 'Jan', 'Zoe', 'Emil'];
const DIMS = [['größer', 'kleiner', 'am größten', 'am kleinsten'], ['älter', 'jünger', 'am ältesten', 'am jüngsten'], ['schneller', 'langsamer', 'am schnellsten', 'am langsamsten']];
const VGL_N = [0, 3, 3, 3, 4, 4, 4, 5, 5, 6, 6];
function makeVergleich(l, rnd) {
  const n = VGL_N[l], o = sample(KINDER, n, rnd), dim = DIMS[Math.floor(rnd() * DIMS.length)];
  const stmts = shuffle(range(n - 1).map(i => rnd() < 0.5 ? o[i] + ' ist ' + dim[0] + ' als ' + o[i + 1] + '.' : o[i + 1] + ' ist ' + dim[1] + ' als ' + o[i] + '.'), rnd);
  const kinds = l <= 3 ? ['top', 'bottom'] : l <= 6 ? ['top', 'bottom', 'pair'] : ['pair', 'count', 'bottom'], kind = kinds[Math.floor(rnd() * kinds.length)];
  let frage, opts, answer;
  if (kind === 'top') { frage = 'Wer ist ' + dim[2] + '?'; opts = shuffle(o, rnd); answer = o[0]; }
  else if (kind === 'bottom') { frage = 'Wer ist ' + dim[3] + '?'; opts = shuffle(o, rnd); answer = o[n - 1]; }
  else if (kind === 'pair') { const i = Math.floor(rnd() * (n - 2)), j = i + 2 + Math.floor(rnd() * (n - i - 2)); frage = 'Wer ist ' + dim[0] + ': ' + (rnd() < 0.5 ? o[i] + ' oder ' + o[j] : o[j] + ' oder ' + o[i]) + '?'; opts = shuffle([o[i], o[j]], rnd); answer = o[i]; }
  else { const i = Math.floor(rnd() * n); frage = 'Wie viele sind ' + dim[0] + ' als ' + o[i] + '?'; opts = range(n).map(String); answer = String(i); }
  return { stmts, frage, opts, answer, order: o, dim };
}
// ---- 5. Code knacken
const FARBEN = ['🔴', '🟡', '🟢', '🔵', '🟣', '🟠', '⚪'];
const CODE_P = [null, [3, 3, 8], [3, 4, 8], [3, 5, 8], [4, 4, 8], [4, 5, 8], [4, 6, 8], [4, 6, 7], [5, 6, 8], [5, 7, 8], [5, 7, 7]];   // Stellen, Farben, Versuche
function makeCode(l, rnd) { const p = CODE_P[l]; return { pegs: p[0], colors: p[1], tries: p[2], code: l < 4 ? sample(range(p[1]), p[0], rnd) : range(p[0]).map(() => Math.floor(rnd() * p[1])) }; }
// Rueckmeldung: wie viele stimmen ganz (Farbe und Platz), wie viele nur in der Farbe.

        return { html: '<div class="stm">' + R.premises.map(esc).join('<br>') + '</div><div class="q">Stimmt dann sicher:<br><b>' + esc(R.concl) + '</b></div>', opts: [{ html: 'Ja, sicher', ok: R.valid }, { html: 'Nein, nicht sicher', ok: !R.valid }], why: esc(R.why) }; });

const ORDER = ['reihe', 'muster', 'platz', 'vergleich', 'code', 'sudoku', 'schluss'];

$('p-close').onclick = () => history.back();

// ================================================================ Ansichten
const view = $('view'), VIEWS = {};

VIEWS.home = () => {
  const p = prof();

    '<div class="row" style="margin-top:10px"><div class="grow"><div class="big">' + p.stars + ' ⭐</div><div class="muted small">' + AGES[p.age].name + '</div></div><button id="h-edit" class="ghost small">ändern</button></div></div>';

};
VIEWS.info = () => {
  view.innerHTML = '<div class="card"><h2>Die Rätsel</h2><ul class="small">' + ORDER.map(g => '<li><b>' + GAMES[g].name + ':</b> ' + GAMES[g].kurz + '</li>').join('') + '</ul></div>' +
    '<div class="card"><h2>Immer neu, immer lösbar</h2><div class="small">Kein Rätsel ist vorgefertigt. Das Handy erzeugt jedes neu und rechnet vor dem Stellen nach, dass es genau eine Lösung gibt. Raten ist nie nötig.</div></div>' +
    '<div class="card"><h2>Stufen und Sterne</h2><div class="small">Jedes Rätsel hat zehn Stufen. Klappt eine Runde, geht es eine Stufe höher, sonst eine zurück. Für jede geschaffte Runde gibt es Sterne in Höhe der Stufe. Jeder Spieler hat eigene Stufen; das Alter legt nur den Einstieg fest.</div></div>' +
    '<div class="card"><h2>Ehrlich eingeordnet</h2><div class="small">Rätseln macht in genau diesen Rätselarten besser und übt, geduldig Schritt für Schritt zu schließen. Dass man dadurch allgemein klüger wird, ist nicht belegt.</div></div>' +
    '<div class="muted small">Denkzirkus v1.0</div>';
};
function render(name) {
  if (!VIEWS[name]) name = 'home';
  $('title').textContent = name === 'info' ? 'So funktioniert es' : 'Denkzirkus'; $('back').style.visibility = name === 'home' ? 'hidden' : 'visible';
  VIEWS[name](); window.scrollTo(0, 0);
}
function route() {
  const h = (location.hash || '#home').slice(1);
  if (G.active && h !== 'play') closeGame();
  if (h === 'play') { if (!G.active) { history.replaceState(null, '', '#home'); render('home'); } return; }

$('back').onclick = () => history.back();
window.addEventListener('hashchange', route);

// ================================================================ Selbsttest
function dzTests() {
  let ok = 0, fail = 0;
  const t = (name, cond, info) => { if (cond) { ok++; console.log('OK   ' + name); } else { fail++; console.error('FAIL ' + name + (info !== undefined ? ' -> ' + info : '')); } };
  let sd = 5; const rnd = () => { sd = (sd * 1103515245 + 12345) & 0x7fffffff; return sd / 0x7fffffff; };
  const uniq = a => new Set(a).size === a.length, all10 = f => { const bad = []; for (let l = 1; l <= 10; l++) for (let k = 0; k < 12; k++) { const r = f(l); if (r !== true) bad.push('Stufe ' + l + ': ' + r); } return bad; };
  t('levelStep', levelStep(3, true) === 4 && levelStep(1, false) === 1 && levelStep(10, true) === 10);

  let bad = all10(l => { const R = makeReihe(l, rnd); return R.opts.length === 4 && uniq(R.opts) && R.opts.indexOf(R.answer) >= 0 && R.terms.length >= 5 && R.terms.every(Number.isInteger) && Number.isInteger(R.answer) || JSON.stringify(R); });
  t('Zahlenreihen: vier verschiedene Antworten, die richtige dabei', !bad.length, bad[0]);
  const r1 = makeReihe(1, rnd), d1 = r1.terms[1] - r1.terms[0]; t('Zahlenreihe Stufe 1: feste Schritte', r1.terms.every((v, i) => !i || v - r1.terms[i - 1] === d1) && r1.answer === r1.terms[4] + d1);
  const r4 = makeReihe(4, rnd), q4 = r4.terms[1] / r4.terms[0]; t('Zahlenreihe Stufe 4: fester Faktor', r4.terms.every((v, i) => !i || v / r4.terms[i - 1] === q4) && r4.answer === r4.terms[4] * q4);
  const r6 = makeReihe(6, rnd), df = r6.terms.map((v, i) => i ? v - r6.terms[i - 1] : 0).slice(1); t('Zahlenreihe Stufe 6: Abstand wächst um 1', df.every((v, i) => !i || v === df[i - 1] + 1) && r6.answer === r6.terms[4] + df[3] + 1);

  bad = all10(l => { const M = makeMuster(l, rnd), fits = M.opts.filter(o => musterFits(M, o)); const same = (x, y) => x.s === y.s && x.c === y.c && x.n === y.n;
    return M.opts.length === (l >= 5 ? 6 : 4) && fits.length === 1 && fits[0] === M.right && M.opts.every((o, i) => M.opts.every((p, j) => i === j || !same(o, p))) || 'passend: ' + fits.length; });
  t('Muster: genau eine Auswahl passt, und zwar die richtige', !bad.length, bad[0]);

  bad = all10(l => { const R = makePlatz(l, rnd), s = solutions(R.n, R.clues), types = platzTypes(l);
    return R.n === PLATZ_N[l] && s.length === 1 && s[0].join() === R.sol.join() && R.clues.every(c => types.indexOf(c.t) >= 0) && R.clues.filter(c => c.t === 'pos').length <= platzMaxPos(l) && uniq(R.animals) || 'Lösungen: ' + s.length; });
  t('Wer steht wo?: genau eine Lösung, nur erlaubte Hinweisarten', !bad.length, bad[0]);
  bad = all10(l => { const R = makePlatz(l, rnd); for (let i = 0; i < R.clues.length; i++) if (solutions(R.n, R.clues.slice(0, i).concat(R.clues.slice(i + 1))).length === 1) return 'überflüssiger Hinweis'; return true; });
  t('Wer steht wo?: kein Hinweis ist überflüssig', !bad.length, bad[0]);
  const an = TIERE.slice(0, 4);
  t('Hinweistexte', clueText({ t: 'pos', a: 0, k: 0 }, an, 4) === 'Der Hund steht ganz links.' && clueText({ t: 'nichtpos', a: 1, k: 2 }, an, 4) === 'Die Katze steht nicht auf Platz 3.' &&
    clueText({ t: 'ld', a: 2, b: 0 }, an, 4) === 'Die Maus steht direkt links von dem Hund.' && clueText({ t: 'zwischen', a: 3, b: 0, c: 1 }, an, 4) === 'Der Frosch steht irgendwo zwischen dem Hund und der Katze.');
  t('clueOk', clueOk({ t: 'ld', a: 0, b: 1 }, [0, 1, 2]) && !clueOk({ t: 'ld', a: 1, b: 0 }, [0, 1, 2]) && clueOk({ t: 'zwischen', a: 1, b: 2, c: 0 }, [0, 1, 2]) && clueOk({ t: 'nichtneben', a: 0, b: 2 }, [0, 1, 2]) && perms(4).length === 24);

  bad = all10(l => { const R = makeVergleich(l, rnd); let exp;
    if (/^Wie viele/.test(R.frage)) { const who = R.frage.match(/als (\S+)\?/)[1]; exp = String(R.order.indexOf(who)); }
    else if (R.frage.indexOf(R.dim[2]) >= 0) exp = R.order[0]; else if (R.frage.indexOf(R.dim[3]) >= 0) exp = R.order[R.order.length - 1];
    else { const m = R.frage.match(/: (\S+) oder (\S+)\?/); exp = R.order.indexOf(m[1]) < R.order.indexOf(m[2]) ? m[1] : m[2]; }
    return R.stmts.length === VGL_N[l] - 1 && R.answer === exp && R.opts.indexOf(R.answer) >= 0 && uniq(R.opts) || R.frage + ' -> ' + R.answer + ' statt ' + exp; });
  t('Vergleichen: Antwort stimmt mit der Reihenfolge überein', !bad.length, bad[0]);

  t('Code-Rückmeldung', JSON.stringify(feedback([0, 1, 2, 3], [0, 1, 2, 3])) === '{"exact":4,"color":0}' && JSON.stringify(feedback([0, 1, 2, 3], [1, 0, 3, 2])) === '{"exact":0,"color":4}' &&
    JSON.stringify(feedback([0, 0, 1, 2], [0, 1, 0, 0])) === '{"exact":1,"color":2}' && JSON.stringify(feedback([0, 1, 2], [3, 3, 3])) === '{"exact":0,"color":0}');
  bad = all10(l => { const R = makeCode(l, rnd); return R.code.length === CODE_P[l][0] && R.code.every(c => c >= 0 && c < CODE_P[l][1]) && (l >= 4 || uniq(R.code)) && R.colors <= FARBEN.length || R.code.join(); });
  t('Code: Farben im erlaubten Bereich, bis Stufe 3 ohne Doppelte', !bad.length, bad[0]);

  const sdOk = (g, d) => { for (let i = 0; i < g.length; i++) { const v = g[i]; g[i] = 0; const can = sdCan(g, d, i, v); g[i] = v; if (!can) return false; } return true; };
  bad = []; for (let l = 1; l <= 10; l++) for (let k = 0; k < 3; k++) { const R = makeSudoku(l, rnd), giv = R.puz.filter(Boolean).length;
    if (!(R.sol.indexOf(0) < 0 && sdOk(R.sol.slice(), R.d) && sdCount(R.puz.slice(), R.d, 2) === 1 && R.puz.every((v, i) => !v || v === R.sol[i]) && giv >= SD_GIVEN[l] && giv < R.sol.length)) bad.push('Stufe ' + l + ', vorgegeben ' + giv); }
  t('Mini-Sudoku: gültige Lösung, genau eine, auf allen Stufen', !bad.length, bad[0]);
  t('Mini-Sudoku: Größe nach Stufe', sdDims(5).n === 4 && sdDims(6).n === 6 && sdDims(6).bw === 3);

  t('Schlussfolgern: jede Form ist richtig als zwingend oder nicht eingestuft', FORMEN.every(f => formValid(f) === f.valid), FORMEN.map((f, i) => formValid(f) === f.valid ? '' : i).join(''));
  t('Schlussfolgern: auf jeder Stufe gibt es zwingende und nicht zwingende Formen', range(10).every(i => { const fs = FORMEN.filter(f => f.min <= i + 1); return fs.some(f => f.valid) && fs.some(f => !f.valid); }));
  const S = makeSchluss(10, rnd); t('Schlussfolgern: Sätze ohne Platzhalter', S.premises.length === 2 && !/\b[ABCx]\b/.test(S.premises.join(' ') + S.concl + S.why), S.why);
  t('Satzbau', stmtText(['alle', 'A', 'B'], { A: QUATSCH[0], B: QUATSCH[1], x: 'Fips' }) === 'Alle Blubbs sind Zapps.' && stmtText(['kein', 'A', 'B'], { A: QUATSCH[0], B: QUATSCH[1], x: 'Fips' }) === 'Kein Blubb ist ein Zapp.' && stmtText(['istnicht', 'x', 'B'], { A: QUATSCH[0], B: QUATSCH[1], x: 'Fips' }) === 'Fips ist kein Zapp.');
  t('Jedes Spiel hat Texte für Kinder und Erwachsene', ORDER.every(g => GAMES[g].k && GAMES[g].e && GAMES[g].kurz && typeof GAMES[g].run === 'function') && ORDER.length === 7);
  t('Alter bestimmt die Einstiegsstufe', lvl({ age: 'k1', levels: {} }, 'reihe') === 1 && lvl({ age: 'e', levels: {} }, 'reihe') === 4 && lvl({ age: 'e', levels: { reihe: 9 } }, 'reihe') === 9);
  console.log('Selbsttest: ' + ok + ' OK, ' + fail + ' Fehler');
  return { ok, fail };
}
window.dzTests = dzTests;
if (/[?&]debug=1/.test(location.search)) window.DZ_TEST = dzTests();
route();
</script>
